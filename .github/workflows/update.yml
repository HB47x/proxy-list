name: Build and publish proxy lists

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private builder
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILDER_REPO }}
          token: ${{ secrets.BUILDER_TOKEN }}
          path: builder

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests yarl pysocks certifi cloudscraper icmplib psutil maxminddb

      - name: Build lists
        working-directory: builder
        run: python HB47x_Proxy_Updater.py

      - name: Publish only worldwide files
        run: |
          cp builder/worldwide_*.txt .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worldwide_*.txt
          git diff --cached --quiet || (git commit -m "Update $(date -u +'%Y-%m-%d %H:%M')" && git push)
